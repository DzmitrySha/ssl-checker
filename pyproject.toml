[project]
name = "ssl-checker"
version = "0.1.0"
description = "CLI: TLS certificate expiry checks, batch Markdown reports, optional HTTP/Windows notifications, daily scheduler, Docker-friendly (Python 3.12+)."
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10.4",
    "cryptography>=48.0.0",
    "loguru>=0.7.3",
    "python-dotenv>=1.2.2",
    "requests>=2.32.5",
]

[project.scripts]
ssl-checker = "main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]
packages = ["core", "config", "notifiers", "locales"]

[tool.uv]
package = true
