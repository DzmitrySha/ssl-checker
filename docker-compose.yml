services:
  ssl-checker:
    build: .
    working_dir: /app
    environment:
      # Пакет при старте контейнера; далее — по DAILY_BATCH_HOURS из .env (в :00 каждого часа).
      RUN_BATCH_ON_START: "true"
    volumes:
      - ./.env:/app/.env:ro
      - ./logs:/app/logs
    command: ["python", "main.py", "--schedule"]
